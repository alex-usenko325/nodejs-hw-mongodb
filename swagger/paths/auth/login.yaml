tags:
  - Auth
summary: User login
operationId: loginUser
description: Authenticate a user and return a JWT token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: 'user@example.com'
          password:
            type: string
            format: password
            example: 'password123'
responses:
  '200':
    description: Login successful
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in!'
            session:
              $ref: '../../components/schemas/session.yaml'
            user:
              $ref: '../../components/schemas/user.yaml'

  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
