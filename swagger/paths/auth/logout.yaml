tags:
  - Auth
summary: User logout
operationId: logoutUser
description: Logout the user and invalidate the JWT token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: 'user@example.com'
responses:
  '200':
    description: Logout successful
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged out!'
            session:
              $ref: ../../components/shemas/session.yaml
            user:
              $ref: ../../components/shemas/user.yaml
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
