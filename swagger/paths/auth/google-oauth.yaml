tags:
  - Auth
summary: Google login
operationId: googleLogin
description: Authenticate a user using Google OAuth and return a JWT token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
        properties:
          token:
            type: string
            example: 'oauth-token'
responses:
  '200':
    description: Google login successful
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully authenticated with Google!
            token:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
