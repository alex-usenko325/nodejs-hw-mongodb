tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: Reset password using a verification code or token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - newPassword
        properties:
          token:
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
          newPassword:
            type: string
            format: password
            example: 'NewSecurePassword123!'
responses:
  '200':
    description: Password reset successful
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password successfully reset. You can now log in.'
  '400':
    description: Invalid or expired token
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid or expired reset token.'
